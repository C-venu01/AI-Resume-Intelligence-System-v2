services:
  - type: web
    name: ai-resume-backend
    runtime: python
    buildCommand: cd backend && pip install -r requirements.txt && python -m spacy download en_core_web_sm
    startCommand: cd backend && python main.py
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: CORS_ORIGINS
        value: https://ai-resume-intelligence-system-v2.vercel.app
      - key: DATABASE_PATH
        value: /tmp/resume_db.sqlite
      - key: RATE_LIMIT_ENABLED
        value: "true"
      - key: MAX_FILE_SIZE_MB
        value: "10"
      - key: MAX_BATCH_SIZE
        value: "20"
      - key: PROMETHEUS_ENABLED
        value: "false"
    healthCheckPath: /api/health
    plan: free
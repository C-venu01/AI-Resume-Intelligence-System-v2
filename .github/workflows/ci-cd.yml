# ==========================================
# GitHub Actions CI/CD Pipeline
# Triggers on push to main branch.
# Steps: Test → Build → Push → Deploy
# ==========================================

name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DOCKER_IMAGE: ${{ secrets.DOCKER_USERNAME }}/resume-intelligence
  EC2_HOST: ${{ secrets.EC2_HOST }}

jobs:
  # ---------- TEST ----------
  test:
    name: 🧪 Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt
          python -m spacy download en_core_web_sm

      - name: Run linter (basic syntax check)
        run: |
          pip install flake8
          flake8 backend/ --max-line-length=120 --ignore=E501,W503,E402

      - name: Run import test
        run: |
          cd backend
          python -c "
          from pdf_extractor import extract_text_from_pdf
          from resume_analyzer import analyze_resume
          from database import init_db
          from models import CandidateResponse
          print('✅ All imports successful')
          "

  # ---------- BUILD & PUSH ----------
  build:
    name: 🐳 Build & Push
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE }}:latest
            ${{ env.DOCKER_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------- DEPLOY ----------
  deploy:
    name: 🚀 Deploy to AWS
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "🚀 Starting deployment..."
            
            # Pull latest image
            docker pull ${{ env.DOCKER_IMAGE }}:latest
            
            # Stop old container
            docker stop resume-intelligence 2>/dev/null || true
            docker rm resume-intelligence 2>/dev/null || true
            
            # Start new container
            docker run -d \
              --name resume-intelligence \
              --restart unless-stopped \
              -p 8000:8000 \
              -v /opt/resume-intelligence/data:/app/backend/data \
              ${{ env.DOCKER_IMAGE }}:latest
            
            # Wait for health check
            sleep 10
            curl -f http://localhost:8000/api/health || exit 1
            
            # Reload Nginx
            sudo systemctl reload nginx
            
            echo "✅ Deployment complete!"

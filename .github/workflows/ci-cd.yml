# ==========================================
# GitHub Actions CI/CD Pipeline
# AI Resume Intelligence System 2.0
#
# Security-focused pipeline:
# - Linting (flake8)
# - Unit tests including auth/security tests
# - Docker build verification
# - NO automatic production deployment
# ==========================================

name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DOCKER_IMAGE: ${{ secrets.DOCKER_USERNAME }}/resume-intelligence

jobs:
  # ---------- LINT & TEST ----------
  test:
    name: 🧪 Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libmagic1

      - name: Install Python dependencies
        run: |
          cd backend
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 pytest httpx
          python -m spacy download en_core_web_sm

      - name: Run flake8 linter
        run: |
          flake8 backend/ \
            --max-line-length=120 \
            --ignore=E501,W503,E402,C901 \
            --exclude=backend/__pycache__,backend/.venv

      - name: Run comprehensive test suite
        env:
          ENVIRONMENT: development
          JWT_SECRET_KEY: test-secret-key-for-ci-only
          ADMIN_PASSWORD_HASH: ${{ secrets.ADMIN_PASSWORD_HASH || '' }}
        run: |
          cd backend
          python -m pytest test_comprehensive.py -v --tb=short -x

      - name: Verify imports
        run: |
          cd backend
          python -c "
          from auth import hash_password, verify_password, create_access_token, require_auth
          from validators import PDFValidator, sanitize_filename
          from rate_limiter import InMemoryRateLimiter
          from config import settings
          from database import init_db, save_candidate, get_all_candidates
          from main import app
          print('✅ All imports successful')
          "

  # ---------- DOCKER BUILD ----------
  build:
    name: 🐳 Build Docker Image
    runs-on: ubuntu-latest
    needs: test
    # Only build on push to main (not PRs)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: secrets.DOCKER_USERNAME != '' && secrets.DOCKER_TOKEN != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ secrets.DOCKER_USERNAME != '' && secrets.DOCKER_TOKEN != '' }}
          tags: |
            ${{ env.DOCKER_IMAGE }}:latest
            ${{ env.DOCKER_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify Docker image starts
        run: |
          docker run -d --name test-container \
            -e ENVIRONMENT=development \
            -e JWT_SECRET_KEY=ci-test-key \
            -p 8000:8000 \
            ${{ env.DOCKER_IMAGE }}:latest

          # Wait for startup (model loading takes time)
          sleep 60

          # Health check
          curl -f http://localhost:8000/api/health || (docker logs test-container && exit 1)

          # Cleanup
          docker stop test-container
          docker rm test-container

  # ---------- DEPLOY (MANUAL APPROVAL REQUIRED) ----------
  # Deploy job removed for security - deployments should be manual
  # To deploy: SSH to server and run docker pull + docker run
  # Or use a separate deployment workflow with environment protection rules

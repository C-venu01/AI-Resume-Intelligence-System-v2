# ==========================================
# AI Resume Intelligence System 2.0
# Docker Compose — Local Development
# ==========================================

version: "3.9"

services:
  app:
    build: .
    container_name: resume-intelligence
    ports:
      - "8000:8000"
    volumes:
      # Persist SQLite database
      - resume_data:/app/backend
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  resume_data:
    driver: local

# ==========================================
# Monitoring Stack — Prometheus + Grafana
# Run with: docker-compose -f docker-compose.monitoring.yml up -d
#
# SECURITY: Do not expose ports to public internet.
# Access via SSH tunnel or VPN only.
# ==========================================

version: "3.9"

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    # Bind to localhost only - access via SSH tunnel or reverse proxy
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
    restart: unless-stopped
    networks:
      - monitoring

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    # Bind to localhost only - access via SSH tunnel or reverse proxy
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      # Set via .env or environment variables - NEVER use defaults in production
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD must be set}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=${GRAFANA_ROOT_URL:-http://localhost:3000}
      - GF_SECURITY_DISABLE_INITIAL_ADMIN_CREATION=false
    volumes:
      - grafana_data:/var/lib/grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    networks:
      - monitoring

volumes:
  prometheus_data:
  grafana_data:

networks:
  monitoring:
    external: false

# ==========================================
# Ansible Inventory — Target Servers
# ==========================================
# Update the IP address after running Terraform
# to provision your AWS EC2 instance.

[webservers]
resume-server ansible_host=YOUR_EC2_PUBLIC_IP ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/resume-app-key.pem

[webservers:vars]
ansible_python_interpreter=/usr/bin/python3
app_name=resume-intelligence
app_port=8000
docker_image=yourdockerhub/resume-intelligence:latest
